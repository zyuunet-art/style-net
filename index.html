<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumpulan Aplikasi</title>

  <style>
    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
      padding: 18px;
    }

    header {
      text-align: center;
      padding: 24px 10px 18px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    header p {
      margin: 8px 0 0;
      color: #687386;
      font-size: 14px;
    }

    .search {
      margin: 10px 0 18px;
    }

    .search input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #dce3ee;
      border-radius: 14px;
      outline: none;
      font-size: 15px;
      background: white;
      box-shadow: 0 4px 14px rgba(20, 35, 60, .06);
    }

    .search input:focus {
      border-color: #65b9e8;
    }

    .apps {
      display: grid;
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 24px rgba(20, 35, 60, .08);
      border: 1px solid #e9eef5;
      transition: transform .2s, box-shadow .2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(20, 35, 60, .12);
    }

    .app-image {
      display: block;
      width: 200px;
      max-width: 75%;
      height: auto;
      margin: 2px auto 13px;
      border-radius: 28px;
    }

    .card h2 {
      text-align: center;
      margin: 0 0 7px;
      font-size: 20px;
    }

    .card p {
      text-align: center;
      margin: 0 0 13px;
      color: #737e90;
      font-size: 13px;
    }

    .button {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #55bde7;
      color: white;
      padding: 12px 15px;
      border-radius: 12px;
      font-weight: 700;
      transition: .2s;
    }

    .button:hover {
      background: #36a9d8;
    }

    .next:hover {
      background: #36a9d8;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 25px;
      color: #737e90;
    }

    footer {
      text-align: center;
      color: #8a94a5;
      font-size: 12px;
      padding: 22px 0 10px;
    }

    @media (max-width: 480px) {
      .container { padding: 14px; }
      header h1 { font-size: 26px; }
      .card { border-radius: 17px; }
      .app-image { width: 180px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <h1>📱 Kumpulan Aplikasi</h1>
      <p>Pilih aplikasi yang ingin kamu buka</p>
    </header>

    <div class="search">
      <input
        type="search"
        id="search"
        placeholder="🔍 Cari aplikasi..."
        autocomplete="off"
      >
    </div>

    <section class="apps" id="apps">

      <article class="card" data-name="halo777">
        <img class="app-image" src="halo777.jpg" alt="Halo777">
        <h2>Halo777</h2>
        <p>Aplikasi Halo777</p>
        <a class="button" target="_blank" rel="noopener noreferrer"
           href="https://halo777.loan?pid=406318562&channel=2010001&pkg=com.halo777.app">
          Buka Aplikasi
        </a>
      </article>

      <article class="card" data-name="Gacor Max">
        <img class="app-image" src="gacormax.jpg" alt="GacorMax">
        <h2>GacorMax</h2>
        <p>Aplikasi GacorMax</p>
        <a class="button" target="_blank" rel="noopener noreferrer"
           href="https://www.sharegacormax.cyou?pid=360669938&channel=2010001&pkg=com.gacormax.app">
          Buka Aplikasi
        </a>
      </article>

      <article class="card" data-name="Putar mega">
        <img class="app-image" src="putarmega.jpg" alt="Putar Mega">
        <h2>Putar Mega</h2>
        <p>Aplikasi Putar Mega</p>
        <a class="button" target="_blank" rel="noopener noreferrer"
           href="https://www.putarmega7.com?pid=486449592&channel=2010001&pkg=com.putarmega.app">
          Buka Aplikasi
        </a>
      </article>

      <article class="card" data-name="Super Hoki">
        <img class="app-image" src="superhoki.jpg" alt="Super Hoki">
        <h2>Super Hoki</h2>
        <p>Aplikasi Super Hoki</p>
        <a class="button" target="_blank" rel="noopener noreferrer"
           href="https://share5superhoki.win?pid=391535500&channel=2010001&pkg=com.superhoki.app">
          Buka Aplikasi
        </a>
      </article>

    </section>

    <div class="empty" id="empty">Aplikasi tidak ditemukan.</div>

    <footer>
      © 2026 Kumpulan Aplikasi
    </footer>

  </main>

  <script>
    const search = document.getElementById("search");
    const cards = document.querySelectorAll(".card");
    const empty = document.getElementById("empty");

    search.addEventListener("input", function () {
      const keyword = this.value.toLowerCase().trim();
      let visible = 0;

      cards.forEach(card => {
        const name = card.dataset.name.toLowerCase();
        const show = name.includes(keyword);

        card.style.display = show ? "" : "none";
        if (show) visible++;
      });

      empty.style.display = visible === 0 ? "block" : "none";
    });
  </script>
</body>
</html>
